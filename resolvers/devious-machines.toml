# Devious Machines has a per-product downloads page (deviousmachines.com/<slug>-downloads/)
# whose download buttons carry "Name X.Y.Z" (latest first; older builds listed below).
# Note the Duck 2 page lives at /duck2-downloads/.
vendor = "Devious Machines"
homepage = "https://deviousmachines.com"

[manual]
login = "https://deviousmachines.com/my-account/"
steps = "Installers are public on each product's downloads page (deviousmachines.com/downloads/ links them all); licenses via My Account."

[[product]]
name = "BassFocus"
page = "https://deviousmachines.com/bassfocus-downloads/"
version_regex = 'BassFocus(?: |%20)([0-9]+\.[0-9]+\.[0-9]+)'
changelog = "https://deviousmachines.com/bassfocus-downloads/#changelog"

