# Third-party source: KVR Audio product-database page (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31: Outersect Modeler 1.2.11, exact match
# to installed OM). id="verosx" is the Mac "Product Version" field.
vendor = "Outersect"
homepage = "https://www.tracktion.com"

[manual]
login = "https://marketplace.tracktion.com"
steps = "Log in to marketplace.tracktion.com, open your products, and download the latest Outersect Modeler installer; version is shown next to the download."

[[product]]
name = "OM"
page = "https://www.kvraudio.com/product/outersect-modeler-by-outersect"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
