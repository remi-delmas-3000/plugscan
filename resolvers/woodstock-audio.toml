# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). The earlier "KVR is Cloudflare-protected" claim only
# holds for HTTP/2 clients: KVR serves HTTP/1.1 + browser UA requests
# (plugscan's ureq client qualifies; verified live 2026-08-31:
# Open Compressor 1.0.7 exact, Waveform Compressor 1.0.7 >= 1.0.6 installed).
# Single-product pages; id="verosx" is the Mac "Product Version" field.
# vendor-direct re-checked 2026-08-31: woodstockaudio.com is a Shopify store;
# installers live behind account order history and the page carries no
# server-side version string (only browser-UA tokens). KVR wins.
vendor = "Woodstock Audio"
homepage = "https://woodstockaudio.com"

[manual]
login = "https://woodstockaudio.com/account/login"
steps = "Log in to your Shopify account at woodstockaudio.com/account/login; re-download installers from your order history."

[[product]]
name = "Open Compressor"
page = "https://www.kvraudio.com/product/open-compressor-by-woodstock-audio"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Waveform Compressor"
page = "https://www.kvraudio.com/product/waveform-compressor-by-woodstock-audio"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
