# Correction 2026-08-31 (wave-3 re-test): partially wrong. The ICONS:Fullerton
# plugin publishes a PUBLIC release-notes PDF whose section titles are stored as
# plaintext (uncompressed) PDF outline entries "VERSION x.y.z | <date>", newest
# first:
#   https://www.fractalaudio.com/downloads/manuals/icons/ICONS-Fullerton-Release-Notes.pdf
# First "VERSION" match = latest. Verified live 2026-08-31: 1.1.0 >= installed 1.1.
# Still no public version source for Cab-Lab 4 (installed 1.01.00) or Pasadena
# (installed 1.0.0, brand-new plugin with only a manual PDF, no release-notes
# PDF yet); those stay unresolved. The cablab API remains auth-gated.
vendor = "Fractal Audio Systems"
homepage = "https://www.fractalaudio.com"

[manual]
login = "https://cablab.fractalaudio.com"
steps = "ICONS plugins install/update via the ICONS app and the Fractal account; Cab-Lab 4 downloads from cablab.fractalaudio.com (login). ICONS:Fullerton current version is in its public release-notes PDF."

[[product]]
name = "FullertonComplete"
page = "https://www.fractalaudio.com/downloads/manuals/icons/ICONS-Fullerton-Release-Notes.pdf"
strategy = "page_regex"
version_regex = 'VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
download = "https://www.fractalaudio.com/icons-amp-modeling-plugin/"
changelog = "https://www.fractalaudio.com/downloads/manuals/icons/ICONS-Fullerton-Release-Notes.pdf"
