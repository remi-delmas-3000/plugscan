# Re-tested 2026-08-31: Cloudflare only 403s curl's HTTP/2 fingerprint. With
# HTTP/1.1 + gzip + a Chrome UA (what ureq sends) every product page serves full
# server-side HTML containing "Current Version: X.Y.Z (updated ...)". Verified
# live: valhalladelay -> 3.0.5, valhalla-supermassive -> 5.0.0,
# valhalla-vintage-verb -> 4.0.5 (all == installed). Product slugs from
# https://valhalladsp.com/product-sitemap.xml. _x64 / AU64 catalog variants are
# the same plugin and share the base product's page.
vendor = "Valhalla DSP"
homepage = "https://valhalladsp.com"

[manual]
steps = "Versions are stated on each product page ('Current Version: ...'). Downloads are public: each product page has Mac installer links; no login needed."

[[product]]
name = "ValhallaDelay"
page = "https://valhalladsp.com/shop/delay/valhalladelay/"
strategy = "page_regex"
version_regex = 'Current Version: ([0-9]+\.[0-9.]+)'
download = "https://valhalladsp.com/shop/delay/valhalladelay/"

