# Correction 2026-08-31 (wave-3 re-test): the skip was wrong. Each plug-in's
# PUBLIC support page (strymon.net/support/<slug>-plug-in/) carries a direct,
# unauthenticated installer link whose filename holds the current version, e.g.
#   /downloads/cloudburstplugin/strymon_Cloudburst_plugin_setup_macOS_1.0.1.pkg
# The macOS .pkg link is the first .pkg on the page = latest. Verified live
# 2026-08-31 (all >= installed; BigSky 1.3.2 and NightSky 1.0.2 are newer).
# Filename shape differs by age: newer plug-ins use "_setup_macOS_X.Y.Z.pkg",
# older ones "_setup_X.Y.Z.pkg" (and BigSky is lowercase), so each product
# anchors on its own filename.
vendor = "Strymon"
homepage = "https://www.strymon.net"

[manual]
login = "https://www.strymon.net/my-account/"
steps = "Public installers on each plug-in support page: strymon.net/support/<name>-plug-in/ (direct .pkg/.zip links; the account is only needed for authorization)."

[[product]]
name = "BigSky"
page = "https://www.strymon.net/support/bigsky-plug-in/"
strategy = "page_regex"
version_regex = 'strymon_bigsky_plugin_setup_([0-9]+\.[0-9]+\.[0-9]+)\.pkg'
download = "https://www.strymon.net/support/bigsky-plug-in/"

[[product]]
name = "Cloudburst"
page = "https://www.strymon.net/support/cloudburst-plug-in/"
strategy = "page_regex"
version_regex = 'strymon_Cloudburst_plugin_setup_macOS_([0-9]+\.[0-9]+\.[0-9]+)\.pkg'
download = "https://www.strymon.net/support/cloudburst-plug-in/"

[[product]]
name = "Deco"
page = "https://www.strymon.net/support/deco-plug-in/"
