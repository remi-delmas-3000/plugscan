# McDSP versions its whole Native plugin line in lockstep; the public
# plugin-downloads page links the current installer whose filename carries the
# version (McDSP_NV_Install_7_3_17_MAC.zip). One page + one regex covers every
# McDSP plugin. Vendor-direct, replaces the earlier KVR-sourced entries.
# Verified 2026-08-31.
vendor = "McDSP"
homepage = "https://www.mcdsp.com"

[manual]
login = "https://mcdsp.com/my-account/"
steps = "Installers: mcdsp.com/downloads/plugin-downloads/ (one Native installer covers all McDSP plugins). License via iLok."

[[product]]
name = "AE600_Active_EQ"
page = "https://mcdsp.com/downloads/plugin-downloads/"
version_regex = 'NV/Mac/[^"]*?_([0-9]+_[0-9]+_[0-9]+)_MAC'
download = "https://mcdsp.com/downloads/plugin-downloads/"

