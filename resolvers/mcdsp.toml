# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31: every McDSP page shows Mac 7.3.17
# (Windows 7.3.0.18) vs 7.3.0 installed - the whole v7 line versions in
# lockstep, so any one product page tracks the line).
# Catalog bundle -> KVR page mapping notes:
#   MC2000_MC202/MC303/MC404 ship in the MC2000 installer (mc2000 page);
#   ML4000_ML1/ML4 ship in the ML4000 installer (ml4000 page);
#   SA2_Dialog_Processor has no KVR page of its own - it points at the SA-3
#   page, valid because the whole line versions in lockstep.
# Single-product pages; id="verosx" is the Mac "Product Version" field.
vendor = "McDSP"
homepage = "https://mcdsp.com"

[manual]
login = "https://mcdsp.com/login/"
steps = "Log in at mcdsp.com, open Downloads > Plug-in Downloads for the latest installers; version news is under mcdsp.com press releases (all v7 plug-ins update in lockstep)."

[[product]]
name = "AE600_Active_EQ"
page = "https://www.kvraudio.com/product/ae600-active-equalizer-by-mcdsp"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

