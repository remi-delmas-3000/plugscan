# 510k Arts' public downloads page lists "Download SEQUND 1.5.6", etc.
vendor = "510k"
homepage = "https://510k.de"

[manual]
steps = "Free/latest installers on 510k.de/pages/downloads; licenses via the 510k shop account email."

