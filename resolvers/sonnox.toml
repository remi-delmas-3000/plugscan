# Correction 2026-08-31 (wave-3 re-test): the skip was wrong. The public
# sonnox.com/installer-database widget loads its data from a PUBLIC Google
# Sheets CSV (no auth, no Cloudflare):
#   Product Name,Version Number,...,Mac Installer URL,...,Release Notes URL
# The CSV lists the current version of every plug-in (verified live
# 2026-08-31 against all 23 installed bundles; all match). Also note the
# Zendesk help-center API (sonnox.zendesk.com/api/v2/help_center/en-gb/...)
# answers curl fine, so "blocks non-browser clients" was wrong too.
# NOTE: installed catalog versions carry a build suffix in brackets
# (e.g. 4.04.0[11320]); the CSV publishes only the dotted version, so
# comparisons should ignore the bracketed build number.
# SuprEsser variants (HighRes/HR/LL/LowLatency) and the two VoxD halves
# (Thicken/Widen) ship in one installer, so they share the parent's row.
vendor = "Sonnox"
homepage = "https://www.sonnox.com"

[manual]
login = "https://my.sonnox.com"
steps = "Public installers for every plug-in: sonnox.com/installer-database (data from the public Google-Sheets CSV, direct dload.sonnoxplugins.com links, no login needed)."

