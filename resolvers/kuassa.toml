# Downloads page https://www.kuassa.com/downloads/ verified 2026-08-30: served HTML lists
# every product with "Current version:" (single X.Y.Z, or "<b>WIN</b> (Win) <br><b>MAC</b> (Mac)"
# for dual-build products). plugscan tracks macOS installs, so dual-build regexes capture the
# (Mac) version. All regexes verified offline against the fetched page (first match = latest).
# EfektorRV3604 omitted: page shows 1.1.0 while installed is 1.2.0 (page not updated for it).
vendor = "Kuassa"
homepage = "https://www.kuassa.com"

[manual]
login = "https://www.kuassa.com/my-account/"
steps = "Log in at kuassa.com/my-account/; installers are under the member downloads area. The public kuassa.com/downloads/ page lists current versions per product."


[[product]]
name = "Amplifikation360"
page = "https://www.kuassa.com/downloads/"
strategy = "page_regex"
version_regex = 'Amplifikation 360</strong>[\s\S]*?\(Win\) <br><b>([0-9][0-9.]*)</b> \(Mac\)'

