# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31). Single-product pages; id="verosx" is
# the Mac "Product Version" field.
# Plugin Boutique product pages (Excite Audio's own store) carry NO version
# strings in served HTML - checked 2026-08-31 - so KVR it is.
# The six Lifeline Console bundles (Console + Comp/EQ/Mod/Pre/Wear modules)
# ship in one installer and share one version; all point at the Console page.
# Verified 2026-08-31: all KVR versions >= installed (e.g. Bloom Vocal Aether
# 1.2.0 vs 1.1.0 installed, VISION 4X 1.2.2 exact).
vendor = "Excite Audio"
homepage = "https://www.exciteaudio.com"

[manual]
login = "https://www.pluginboutique.com/user/sign_in"
steps = "Log in to Plugin Boutique, open My Account > My Downloads, find the Excite Audio product - latest installer version is shown there."

[[product]]
name = "Bloom Bass Impulse"
page = "https://www.kvraudio.com/product/bloom-bass-impulse-by-excite-audio"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

