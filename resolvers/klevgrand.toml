# klevgrand.com product pages render installer cards server-side as
# "macOS version ... <Product> v<!-- -->X.Y.Z" (macOS card first, so the first
# regex match is the latest macOS installer version). Verified live 2026-08-31
# on dawcassette (1.2.3), korvpressor (2.1.2), oneshot (2.0.2).
# OneShot (v1) is legacy and no longer has its own page; /products/oneshot now
# serves OneShot2, so only OneShot2 gets an entry.
vendor = "Klevgrand"
homepage = "https://klevgrand.com"

[manual]
login = "https://klevgrand.com/login"
steps = "Log in at klevgrand.com/login; downloads on each product page (public demos, licences in account)."

[[product]]
name = "Altitude"
page = "https://klevgrand.com/products/altitude"
strategy = "page_regex"
version_regex = 'v<!-- -->([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
download = "https://klevgrand.com/products/altitude"

