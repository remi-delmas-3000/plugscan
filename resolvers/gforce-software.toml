# Version detection: the single aggregated changelog at
# gforcesoftware.com/help/updates-and-releases/ lists every product newest-first
# as <h3>Publisher Product</h3> ... <h3>v X.Y.Z</h3>. Per-product regexes anchor
# on the product's <h3> title and grab the first following version. Verified live
# 2026-08: 15 products matched or exceeded installed. NOT auto-checked (changelog
# lags the installed build, so it would report an older "latest"): M-Tron Pro IV
# (page 1.0.1 < installed 1.0.2), OB-E (page 2.5.1 < installed 2.6); IconDrum has
# no changelog entry yet. Those three stay manual.
vendor = "GForce Software"
homepage = "https://www.gforcesoftware.com"

[manual]
login = "https://www.gforcesoftware.com/my-account/"
steps = "Log in at gforcesoftware.com/my-account/; installers under Account > Downloads. Latest versions are listed at gforcesoftware.com/help/updates-and-releases/. M-Tron Pro IV, OB-E and IconDrum are not auto-checked (changelog lags or lacks an entry) - verify them on that page manually."


[[product]]
name = "Axxess"
page = "https://www.gforcesoftware.com/help/updates-and-releases/"
strategy = "page_regex"
version_regex = '(?s)<h3>Axxess</h3>.*?<h3>(?:<[^>]+>)*v([0-9]+(?:\.[0-9]+)*)'
changelog = "https://www.gforcesoftware.com/help/updates-and-releases/"

