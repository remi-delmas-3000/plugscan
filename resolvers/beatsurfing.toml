# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31, all >= installed: 7DeadlySnares 1.1.1,
# Beatfader 1.2.0, CHEat code 1.2.3, LOW 1.1.2, LunchTable 1.1.3,
# RANDOM 1.2.3, RANDOM Metal 1.0.12, VRAC+ 1.0.2).
# "Beatfader MIDI" ships in the Beatfader installer and shares its version.
# The LOW page is KVR's "LOW (Low)" bass synth entry.
# Single-product pages; id="verosx" is the Mac "Product Version" field.
vendor = "BEATSURFING"
homepage = "https://beatsurfing.com"

[manual]
login = "https://beatsurfing.com/my-account/"
steps = "Log in at beatsurfing.com/my-account, open the Downloads section to grab the latest installers; version numbers are only visible in the installer file names / release emails."

[[product]]
name = "7DeadlySnares"
page = "https://www.kvraudio.com/product/7deadlysnares-by-beatsurfing"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Beatfader"
