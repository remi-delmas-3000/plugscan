# Vendor-direct: each BEATSURFING plugin's product page embeds a changelog fed
# by a public JSON at download.beatsurfing.com/<name>ReleaseNotes.json. The
# newest release is the first array element; its "version" field is the current
# version and "url_mac"/"url_win" are the installers. Verified live 2026-08-31,
# all >= installed: 7DeadlySnares 1.1.1, Beatfader 1.2.0, CHEat code 1.2.3,
# LOW 1.1.2, LunchTable 1.1.3, RANDOM 1.2.3, RANDOM Metal 1.0.12, VRAC+ 1.0.2.
# "Beatfader MIDI" ships in the Beatfader installer and shares its JSON/version.
vendor = "BEATSURFING"
homepage = "https://beatsurfing.com"

[manual]
login = "https://beatsurfing.com/my-account/"
steps = "Log in at beatsurfing.com/my-account, open the Downloads section to grab the latest installers. Each product page (beatsurfing.com/audio-plugins/<name>/) shows a changelog with the current version."

[[product]]
name = "7DeadlySnares"
page = "https://download.beatsurfing.com/7deadlysnaresReleaseNotes.json"
version_regex = '"version"\s*:\s*"([0-9][0-9A-Za-z.]*)"'
download = "https://beatsurfing.com/audio-plugins/7deadlysnares/"

[[product]]
name = "Beatfader"
page = "https://download.beatsurfing.com/beatfaderReleaseNotes.json"
version_regex = '"version"\s*:\s*"([0-9][0-9A-Za-z.]*)"'
