# musikhack.com publishes per-product release notes pages; the newest version is
# the first "<p>N.N.N" entry (older entries use different markup).
vendor = "Musik Hack"
homepage = "https://www.musikhack.com"

[manual]
login = "https://www.musikhack.com/account/"
steps = "Log in at musikhack.com/account to download installers. Release notes are public at musikhack.com/products/<name>/release_notes/."

[[product]]
name = "FUEL"
page = "https://www.musikhack.com/products/FUEL/release_notes/"
version_regex = '<p>([0-9]+\.[0-9]+\.[0-9]+)'
changelog = "https://www.musikhack.com/products/FUEL/release_notes/"

[[product]]
name = "Master Plan v1.5"
page = "https://www.musikhack.com/products/masterplan/release_notes/"
version_regex = '<p>([0-9]+\.[0-9]+\.[0-9]+)'
changelog = "https://www.musikhack.com/products/masterplan/release_notes/"
