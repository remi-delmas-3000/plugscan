# All Melda plugins share one bundle version. The homepage news feed leads with
# "VXX.YY Update Released" (newest first). /download returns 403 to bots; homepage works.
# Verified 2026-08-30 (V17.09).
vendor = "MeldaProduction"
download_via = "MInstaller — MeldaProduction's manager (get it once from meldaproduction.com/download; it updates all Melda plugins)"
homepage = "https://www.meldaproduction.com"

[manual]
login = "https://www.meldaproduction.com/signin"
steps = "Download the MSoundFactory/MPluginManager installer from meldaproduction.com/download (public); licences activate in-plugin after sign-in."

