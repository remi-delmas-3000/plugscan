# Aurora DSP put download-files behind a login (2026-08-31): the page now
# 403s and redirects to auroradsp.com/login for non-authenticated clients, so
# there is no public version source. The Firebase News.json feed used earlier
# lagged actual releases. Manual check via the account download page.
vendor = "Aurora DSP"
homepage = "https://auroradsp.com"
skip = "Downloads moved behind login: auroradsp.com/download-files 403s and redirects to /login; no public version source (the Firebase News feed lags releases)."

[manual]
login = "https://auroradsp.com/login"
steps = "Log in at auroradsp.com/login, then auroradsp.com/download-files lists each plugin's current macOS installer with its version in the filename."
