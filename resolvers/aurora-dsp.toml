# Aurora DSP's authoritative source is the public download-files page, which
# server-renders each product block: the version sits ~210 chars before that
# product's .pkg installer link. (The Firebase News.json used earlier lagged
# actual releases: Banshee 1.0.5 vs real 1.1.0, Mammoth 1.6.2 vs 1.7.0.)
# Rust regex has no lookahead, so each entry bounds the gap with {0,300}.
# Verified live 2026-08-31.
vendor = "Aurora DSP"
homepage = "https://auroradsp.com"

[[product]]
name = "Absylon"
page = "https://auroradsp.com/download-files"
version_regex = '([0-9]+\.[0-9]+(?:\.[0-9]+)?)[\s\S]{0,300}?Absylon\.pkg'
download = "https://auroradsp.com/download-files"

