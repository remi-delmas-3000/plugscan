# Correction 2026-08-31 (wave-3 re-test): the skip was wrong. The plugin
# binaries fetch their in-app "update available" notice from a PUBLIC Firebase
# Realtime Database (found via strings on the .component):
#   https://aurora-b10f0-default-rtdb.europe-west1.firebasedatabase.app/News.json
# It returns a JSON map keyed by product name, each with a "pluginVersion"
# field holding the current published version. No auth, answers plain GET.
# All 17 products here verified live 2026-08-31 (>= installed; several newer,
# e.g. Rhino 1.7.2, Mammoth 1.6.2, Banshee Nano 1.0.5, AK476 1.0.2).
# EXCLUDED (no key in the feed): Gate Mate Pre, Kobraa, Laboga Mr Hector Suite.
vendor = "Aurora DSP"
homepage = "https://auroradsp.com"

[manual]
login = "https://auroradsp.com/module/mymodule/login"
steps = "Log in to the Aurora DSP client area for installers (auroradsp.com/download-files). The in-app updater reads News.json (public) for the current version of each plugin."

[[product]]
name = "Absylon"
page = "https://aurora-b10f0-default-rtdb.europe-west1.firebasedatabase.app/News.json"
strategy = "json"
json_path = "Absylon.pluginVersion"
download = "https://auroradsp.com/download-files"

