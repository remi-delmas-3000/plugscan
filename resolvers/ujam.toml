# Checked 2026-08-30: ujam.com/release-notes/ is JS-rendered (no versions in served HTML).
# The UJAM.app (Electron; com.ujam.ujam) fetches its catalog from producthub.ujam.com via
# www.ujam.com/api/v1/clients/app/manufacturers/{manufacturer_id}/channels/{channel_id}/products
# -- but that base needs a manufacturer_id/channel_id the app resolves after user login
# (www.ujam.com/api/v1/clients/app/manufacturers/ returns 404 without one), so it is not
# reachable unauthenticated. Updates ship through the UJAM App itself.
vendor = "UJAM"
homepage = "https://www.ujam.com"
download_via = "UJAM App (ujam.com/ujam-app): the desktop manager installs and updates all UJAM products for the logged-in account."
skip = "Versions come from the authenticated UJAM App catalog API (producthub.ujam.com, keyed by a login-resolved manufacturer/channel id); no unauthenticated endpoint and the release-notes page is JS-rendered; re-verified 2026-08-31: the producthub.ujam.com API (/api/v1/products) returns 401 Authorization header missing without a login"
[manual]
login = "https://www.ujam.com/login/"
steps = "Use the UJAM App to install and update products (it manages versions for your account). ujam.com/release-notes/ exists but is JS-rendered, so it cannot be scraped."
