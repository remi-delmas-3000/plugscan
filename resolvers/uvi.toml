# Alias note: catalog vendors 'Uvisoundsource' (UVIWorkstation) refer to the same company.
# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31). Single-product pages; id="verosx" is
# the Mac "Product Version" field.
# KVR even tracks UVI's internal year-style Falcon versioning: 26.0.7 shown,
# exact match to the installed bundle version. All other pages matched
# installed exactly or newer (e.g. Relayer 1.5.8, SparkVerb 1.5.0).
# The five UVI Tape * bundles ship as one "Tape Suite" product/version;
# the three UVIWorkstation* bundles share the uvi-workstation page.
# vendor-direct re-checked 2026-08-31: uvi.net product pages are marketing-only
# (Falcon shows just a "Version 2026" year label, no per-product X.Y.Z) and
# updates are delivered by the UVI Portal desktop app. KVR tracks the real
# per-product versions better, so it stays the source.
vendor = "UVI"
homepage = "https://www.uvi.net"
download_via = "UVI Portal (uvi.net/download-uvi-portal): the desktop manager installs and updates all UVI products for the logged-in account."

[manual]
login = "https://www.uvi.net/my-products"
steps = "Updates are managed by the UVI Portal app; log in at uvi.net/my-products to see registered products and installers."

[[product]]
name = "DualDelayX"
page = "https://www.kvraudio.com/product/dual-delay-x-by-uvi"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

