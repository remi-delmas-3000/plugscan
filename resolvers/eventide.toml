# Correction 2026-08-31 (user report): the downloads pages DO serve versions
# server-side without login. Each /downloads/?product=<name> page carries
# "<name> Installer (Mac 64-bit)" followed by <div class='version-number'>
# Version X.Y.Z</div>. The earlier wave-2 conclusion (auth-gated) was wrong:
# it mistook theme asset ?ver= numbers for the only version strings served.
# "No MIDI" and "Dual" variants ship inside the parent product's installer,
# so they point at the parent's page.
vendor = "Eventide"
homepage = "https://www.eventideaudio.com"

[manual]
login = "https://www.eventideaudio.com/my-account/"
steps = "Installers: eventideaudio.com/downloads/ (filter by product). Versions are shown next to each installer; the download itself needs login."

[[product]]
name = "Blackhole"
page = "https://www.eventideaudio.com/downloads/?product=Blackhole%C2%AE"
version_regex = "\\(Mac[^)]*\\)</a><div class='version-number'>Version ([0-9]+\\.[0-9.]+)"
download = "https://www.eventideaudio.com/downloads/?product=Blackhole%C2%AE"

