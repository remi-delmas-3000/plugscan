# LiquidSonics lists every installer with versioned filenames (e.g. Illusion-v1.4.6) on one
# public downloads page. Windows builds can be a point release ahead of macOS; first match wins.
vendor = "LiquidSonics"
homepage = "https://www.liquidsonics.com"

[manual]
steps = "All installers are public at liquidsonics.com/downloads/ (no login). Licenses are iLok."

[[product]]
name = "Cinematic Rooms Professional"
page = "https://www.liquidsonics.com/downloads/"
version_regex = 'Cinematic_Rooms_Professional-v([0-9]+\.[0-9.]+)'
download = "https://www.liquidsonics.com/downloads/"

[[product]]
name = "Illusion"
page = "https://www.liquidsonics.com/downloads/"
version_regex = 'Illusion-v([0-9]+\.[0-9.]+)'
download = "https://www.liquidsonics.com/downloads/"

[[product]]
name = "Lustrous Plates"
page = "https://www.liquidsonics.com/downloads/"
version_regex = 'Lustrous_Plates-v([0-9]+\.[0-9.]+)'
download = "https://www.liquidsonics.com/downloads/"

[[product]]
name = "Reverberate"
page = "https://www.liquidsonics.com/downloads/"
version_regex = 'Reverberate-v([0-9]+\.[0-9.]+)'
download = "https://www.liquidsonics.com/downloads/"

[[product]]
name = "Seventh Heaven Professional"
page = "https://www.liquidsonics.com/downloads/"
version_regex = 'Seventh_Heaven_Professional-(?:Plugins|Update|Complete)_v([0-9]+\.[0-9.]+)'
download = "https://www.liquidsonics.com/downloads/"
