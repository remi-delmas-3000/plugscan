# Correction 2026-08-31 (wave-3 re-test): the skip was wrong. The public
# downloads page mixwave.com/pages/downloads is driven by the theme asset
# product-downloads.js, which contains productDownloadsData with a
# per-product currentVersion field plus direct (public, unauthenticated)
# S3 installer links for every plugin, including full legacy version
# history. All 32 tracked bundles verified live 2026-08-31 (all >= installed).
# NOTE: the asset lives under the theme path /cdn/shop/t/46/; if the theme id
# changes, the current asset URL is referenced from
# https://mixwave.com/pages/downloads (script tag "product-downloads.js").
# "Collection" products (Benson Chimera/Monarch, JHS Loud Is More Good,
# Milkman Creamer) are the parent installers for those bundles.
#
# Collection-delivered pedals (2026-09-04): six Benson pedals (Delay, Florist,
# Germanium Boost, Germanium Fuzz, Preamp, Tall Bird) and three Milkman pedals
# (Harmonic Tremolo Reverb, JHS Slap Boost, Pop Top Boost) are shipped ONLY by
# their collection installer, which stamps each pedal's Info.plist with the
# collection's version (Chimera 1.2.0, Creamer 1.0.4). MixWave never retired
# the pedals' standalone currentVersion fields (frozen at 1.0.x), so reading a
# pedal's own field reported a "latest" BELOW the installed collection build.
# Those pedals' version_regex therefore anchors on the *collection* product
# name, not the pedal's, so latest tracks what actually gets installed.
vendor = "MixWave"
homepage = "https://mixwave.com"

[manual]
login = "https://mixwave.com/account"
steps = "Public installers for every plugin: mixwave.com/pages/downloads (search & filter; direct S3 links, no login required)."

[[product]]
name = "MixWave 1981 DRV"
page = "https://mixwave.com/cdn/shop/t/46/assets/product-downloads.js"
strategy = "page_regex"
version_regex = 'productName:"1981\ DRV"[^\n]*?currentVersion:"([0-9]+\.[0-9]+\.[0-9]+)"'
download = "https://mixwave.com/pages/downloads"

