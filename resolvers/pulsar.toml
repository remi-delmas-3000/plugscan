# Pulsar Audio publishes all current installer links on a single public download
# page; the version is embedded in the S3 installer filename (Pulsar-<Name>-X.Y.Z.dmg/.exe).
# Note: /downloads/ (plural) is Cloudflare-403; /download/ (singular) works with a browser UA.
vendor = "Pulsar"
homepage = "https://pulsar.audio"

[manual]
steps = "Open https://pulsar.audio/download/ — every plugin's latest installer (dmg/exe) is listed with the version in the filename."

[[product]]
name = "Pulsar 1178"
page = "https://pulsar.audio/download/"
version_regex = 'Pulsar-1178-([0-9]+\.[0-9]+\.[0-9]+)'

