# All plugins ship in one Soundtoys 5.x bundle sharing a single version.
# The public installer manifest at storage.googleapis.com/soundtoys-download/download.json
# (referenced by soundtoys.com/downloads/) is a JSON dict keyed "<Sku>_Mac";
# each entry's `fullversion` is the released build. Verified 2026-08-30:
# all products at 5.5.5.19885 (installed baseline 5.5.4.18982). FilterFreak1/2 share
# the single FilterFreak installer.
vendor = "Soundtoys"
homepage = "https://www.soundtoys.com"

[manual]
login = "https://accounts.soundtoys.com/"
steps = "Log in at accounts.soundtoys.com to download the latest Soundtoys 5.5 bundle installer; a single bundle authorizes all owned plugins."

[[product]]
name = "Crystallizer"
page = "https://storage.googleapis.com/soundtoys-download/download.json"
strategy = "json"
json_path = "Crystallizer5_Mac.fullversion"
