# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). The desktop builds are published on KVR under AIR Music
# Technology (the inMusic sister brand that builds them), with full four-part
# build numbers. Verified live 2026-08-31: Fly Tape II 1.0.0.27 and Lo Fly
# Dirt 1.0.0.55 - exact matches to installed. KVR needs HTTP/1.1 + browser UA
# (plugscan's ureq client qualifies); id="verosx" = Mac version field.
# vendor-direct re-checked 2026-08-31: the desktop builds live behind the
# inMusic Profile login (profile.inmusicbrands.com), and airmusictech.com pages
# carry only WordPress asset tokens. No public vendor-direct version, so KVR
# (AIR Music Technology product pages, with the full four-part builds) stays.
vendor = "MSXII Sound Design"
homepage = "https://www.msxaudio.com"
download_via = "inMusic Software Center / inMusic Profile (profile.inmusicbrands.com) — lists and installs the latest Fly Tape II and Lo Fly Dirt versions"

[manual]
login = "https://profile.inmusicbrands.com"
steps = "Log in to the inMusic Profile (profile.inmusicbrands.com), open Software/Downloads: latest Fly Tape II and Lo Fly Dirt installers are listed there with version numbers. Product info at airmusictech.com/effects/."

[[product]]
name = "Fly Tape II"
page = "https://www.kvraudio.com/product/fly-tape-ii-by-air-music-technology"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Lo Fly Dirt"
page = "https://www.kvraudio.com/product/lo-fly-dirt-by-air-music-technology"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
