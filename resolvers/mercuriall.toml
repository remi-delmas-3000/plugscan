# Partial correction 2026-08-31: the SS-11X product page DOES publish versions.
# mercuriall.com/cms/details_ss-11x embeds a "Changes since initial release"
# changelog whose newest entry is "Version 1.2" (newest-first; verified live
# against installed 1.2.0 - Mercuriall publishes major.minor only there).
# Ampbox remains unresolvable: its page carries only "Neural Hybrid Engine
# version 3.x" (the modeling engine, not the app, installed app is 1.9.0),
# downloads are POST forms with CSRF tokens (no scrapeable filename), and
# forum.mercuriall.com serves a TLS cert that fails hostname verification.
vendor = "Mercuriall"
homepage = "https://mercuriall.com"

[manual]
login = "https://mercuriall.com/cms/user"
steps = "Log in at mercuriall.com for Ampbox installers (no public Ampbox version source); update announcements appear on the site front page and Mercuriall's KVR/Gearspace threads."

[[product]]
name = "SS-11X"
page = "https://mercuriall.com/cms/details_ss-11x"
version_regex = 'Version ([0-9]+\.[0-9.]+)'
changelog = "https://mercuriall.com/cms/details_ss-11x"
download = "https://mercuriall.com/cms/details_ss-11x"
