# Each Blue Cat product page has a news section with anchors like
# name="2026_05_21_V2.78" (newest first). Generic regex verified on PatchWork
# and Axiom pages 2026-08-30. Slugs taken from bluecataudio.com/Products/Category_0_All/.
vendor = "Blue Cat Audio"
homepage = "https://www.bluecataudio.com"

[manual]
login = "https://www.bluecataudio.com/Login/"
steps = "Log in at bluecataudio.com/Login/, then My Downloads for full installers. Demo installers are public on each product page."

