# Version detection: SSL Download Manager's public catalog API.
# https://api.solidstatelogic.com/software/dm/all?track=live returns
# deployableInfos.<id>.latestVersionMac for every plug-in. Verified live 2026-08:
# all 42 installed products matched their latestVersionMac exactly. Endpoint
# extracted from SSL Download Manager.app (Electron) app.asar.
vendor = "Solid State Logic"
homepage = "https://www.solidstatelogic.com"
download_via = "SSL Download Manager app (get it at solidstatelogic.com/support-page/downloads); it installs/updates licensed plug-ins."

[manual]
login = "https://account.solidstatelogic.com"
steps = "Log in to the SSL portal (account.solidstatelogic.com / store.solidstatelogic.com) and use the SSL Download Manager to install plug-in updates. Release notes live in the Zendesk help centre (support.solidstatelogic.com)."


[[product]]
name = "SSL 360 Link"
page = "https://api.solidstatelogic.com/software/dm/all?track=live"
strategy = "json"
