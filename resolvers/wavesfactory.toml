# Wavesfactory keeps a single changelog page listing the latest version of every product
# as '<a ...>Name</a> - X.Y.Z'. Note "Cassette Transport" (free plugin) appears after "Cassette".
vendor = "Wavesfactory"
homepage = "https://www.wavesfactory.com"

[manual]
steps = "Plugins have a built-in auto-updater; installers also at wavesfactory.com/support (My Purchases requires the order email). Version list: wavesfactory.com/blog/posts/changelog-and-updates/."

[[product]]
name = "Cassette"
page = "https://www.wavesfactory.com/blog/posts/changelog-and-updates/"
version_regex = 'Cassette</a> - ([0-9]+\.[0-9.]+)'
changelog = "https://www.wavesfactory.com/blog/posts/changelog-and-updates/"

