# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31: Filterverse 1.2.1 >= 1.2.0 installed,
# Manipulator 1.4.9 >= 1.4.8, Supermodal 1.0 vs 1.0.0 installed).
# Single-product pages; id="verosx" is the Mac "Product Version" field.
vendor = "Polyverse Music"
homepage = "https://polyversemusic.com"

[manual]
steps = "Open polyversemusic.com/downloads in a browser for the latest installers of Manipulator, Filterverse and Supermodal; release announcements on the Polyverse blog."

[[product]]
name = "Filterverse"
page = "https://www.kvraudio.com/product/filterverse-by-polyverse-music"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Manipulator"
page = "https://www.kvraudio.com/product/manipulator-by-polyverse-music"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Supermodal"
page = "https://www.kvraudio.com/product/supermodal-by-polyverse-music"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
