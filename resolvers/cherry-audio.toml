# Version detection: per-product version-history pages at
# cherryaudio.com/products/<slug>/version-history. Verified live 2026-08 across
# DCO-106 (page 1.4.0 == installed 1.4.0), Blue3 (1.0.13 == 1.0.13), Trident
# (page 1.0.16 vs installed 1.0.17) and Mercury-4 (page 1.5.0 vs 1.6.0): the
# first <strong>X.Y.Z Build N</strong> entry is the latest PUBLISHED version and
# uses the same numbering the installed plugins report (page may trail the newest
# installer by a build). Slugs confirmed from cherryaudio.com/products.
# FX / Multi Out variants share their base synth's page (same engine version).
# Installers still require an account login (see [manual]).
vendor = "Cherry Audio"
homepage = "https://cherryaudio.com"

[manual]
login = "https://cherryaudio.com/login"
steps = "Log in at cherryaudio.com/login; installers under Your Account > Downloads. Original 'Memorymode' (superseded by Memorymode V2) has no standalone version-history page, so it is checked manually."


[[product]]
name = "Atomika"
page = "https://cherryaudio.com/products/atomika-synthesizer/version-history"
strategy = "page_regex"
version_regex = '<strong>\s*([0-9]+\.[0-9]+\.[0-9]+)'
changelog = "https://cherryaudio.com/products/atomika-synthesizer/version-history"

