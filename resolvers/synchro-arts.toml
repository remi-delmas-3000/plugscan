# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31). Single-product pages; id="verosx" is
# the Mac "Product Version" field (regex stops at whitespace, so trailing
# annotations like "6.1.32 (VST3 1.3.51.1)" capture just "6.1.32").
# Verified 2026-08-31: RePitch 2 Standard 2.0.108 (>= 2.0.100 installed),
# Revoice Pro 5.1.33 (>= 5.1.32; the four RevoicePro* helper bundles ship in
# the Revoice Pro installer and share its version), VocAlign Pro 6.1.32
# (>= 6.1.30), VocAlign Ultra 1.4.1 (installed version unknown in catalog).
# vendor-direct re-checked 2026-08-31: synchroarts.com/downloads-and-manuals
# hosts only manuals plus a Zendesk "Legacy Installers" link; current installer
# versions live behind app.synchroarts.com login. No server-side version. KVR wins.
vendor = "Synchro Arts"
homepage = "https://www.synchroarts.com"

[manual]
login = "https://app.synchroarts.com/my-plugins"
steps = "Log in at app.synchroarts.com/my-plugins to see your plugins and latest installer versions (RePitch, VocAlign, Revoice Pro); public synchroarts.com/downloads-and-manuals only hosts manuals."

[[product]]
name = "RePitch"
page = "https://www.kvraudio.com/product/repitch-2-standard-by-synchro-arts"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

