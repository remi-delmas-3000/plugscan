# Fine Classics Plugins (Shopify store). No version numbers are published anywhere on
# the site (product pages and the Subtle Spaces download page were checked live);
# updates are announced via the newsletter and re-delivered through download emails.
# Wave-2 re-check 2026-08-30: the plugin binaries call Google Cloud Functions at
# us-central1-fineclassicsplugins.cloudfunctions.net (/product_version,
# /product_registration, /product_trial). /product_version exists but needs a
# product key the plugin supplies internally ("Product not found" for every
# guessed ?product= value), so it is not publicly usable.
vendor = "Fine Classics Plugins"
homepage = "https://fineclassicsplugins.com"
skip = "No usable version endpoint: the vendor's product_version cloud function requires an undocumented product identifier and the Shopify store publishes no versions"

[manual]
steps = "Check https://fineclassicsplugins.com/products/fine-classics-pedalboard and https://fineclassicsplugins.com/pages/subtle-spaces-free-plugin for update announcements; no version numbers are published on the site, so re-download installers from your purchase/freebie email link or contact support to confirm the latest version."
