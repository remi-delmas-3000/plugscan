# Audiority publishes a single HTML table of all plugin latest versions at
# /plugin-versions/ (columns: name | vX.Y | date | download links). Each product
# appears once; regex anchors on the name cell followed by the version cell.
# Note: table lists "Green Reaper GR9" for Green Reaper; full "Klirrton Grindstein"
# name is used in the cell.
vendor = "Audiority"
homepage = "https://www.audiority.com"

[manual]
login = "https://www.audiority.com/my-account/"
steps = "Log in at audiority.com/my-account/, or check the public table at audiority.com/plugin-versions/ for latest versions and direct download links."

[[product]]
name = "Big Goat"
page = "https://www.audiority.com/plugin-versions/"
version_regex = 'Big Goat</td>\s*<td>v([0-9]+\.[0-9.]+)'

