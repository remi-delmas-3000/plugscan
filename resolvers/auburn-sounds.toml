# installed versions may have a trailing .0). Static site, curl-friendly.
vendor = "Auburn Sounds"
homepage = "https://www.auburnsounds.com"

[manual]
steps = "Go to auburnsounds.com > Products > Inner Pitch; the free/full download link is on the product page."

[[product]]
