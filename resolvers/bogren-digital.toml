# Correction 2026-08-31 (wave-3 re-test): the PUBLIC downloads page
# https://bogrendigital.com/pages/downloads serves direct installer links on
# files.bogrendigital.com with the full build version in the filename
# (e.g. "Ampknob - BDH 5169 MAC v1.2.134.pkg"), server-side, no login.
# The earlier skip ("versions only in installers/account downloads") only
# checked the Shopify catalog JSON, not this page. Links are %-encoded in the
# HTML, so the regexes match the encoded form.
# All 20 tracked bundles verified live 2026-08-31; 19 match or exceed the
# installed version. "AmpKnob - RevC" is EXCLUDED: the page still links
# v1.3.139 while 1.3.140 is installed (page lags the newest build), so no
# safe resolver for that one bundle.
vendor = "Bogren Digital"
homepage = "https://bogrendigital.com"

[manual]
login = "https://bogrendigital.com/account"
steps = "Public installers (all products, current versions): bogrendigital.com/pages/downloads. AmpKnob - RevC on that page can lag the newest build; get it from My Downloads after login."

[[product]]
name = "Ampknob - BDE 120"
page = "https://bogrendigital.com/pages/downloads"
strategy = "page_regex"
version_regex = 'Ampknob%20-%20BDE%20120%20MAC%20v([0-9]+\.[0-9]+\.[0-9]+)'
download = "https://bogrendigital.com/pages/downloads"

