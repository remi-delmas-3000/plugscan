# Correction 2026-08-31 (wave-3 re-test): the skip was wrong. The PUBLIC
# babyaud.io/downloads page (Webflow "fs_accordion" list) states each plugin's
# current version inline next to its name:
#   <div class="fs_accordion-2_label">NAME</div><div>vX.Y[.Z]</div>
# and links direct, unauthenticated S3 installers. All 15 tracked plugins that
# appear on the page verified live 2026-08-31 (>= installed; Grainferno 1.2 and
# SubCulture 1.0.3 are newer). NOTE: many BABY versions are 2-part (v1.6).
# Not on the downloads page (free/bundled extras, no version shown): BA-1 FX
# Strip, BabyComeback, Beat Slammer, Magic Dice, Magic Switch, Pitch Drift,
# Smooth Operator (base), Warp -- those stay unresolved.
vendor = "BABY Audio"
homepage = "https://babyaud.io"

[manual]
login = "https://plan.babyaud.io/"
steps = "Public installers + current versions: babyaud.io/downloads (direct S3 links; the account portal is only needed for licences)."

[[product]]
name = "Atoms"
page = "https://babyaud.io/downloads"
strategy = "page_regex"
version_regex = 'Atoms\s*</div><div>\s*v([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
download = "https://babyaud.io/downloads"

