# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31: Astronaut Reverb 1.4.0 (installed
# "1.4"), OktabEP 1.0.0 (installed "1")).
# Prism (installed 0.1, early/beta build) has no KVR page and no other indexed
# version source was found - that bundle stays unresolved.
# Single-product pages; id="verosx" is the Mac "Product Version" field.
# vendor-direct re-checked 2026-08-31: shift-line.com/downloads only hosts
# hardware-pedal PDFs and IR packs (Astronaut III guides, CabZone), no plugin
# installer or version string. KVR remains the source for the plugin builds.
vendor = "Shift Line"
homepage = "https://shift-line.com"

[manual]
steps = "Plugin builds (Astronaut, OktabEP, Prism) via shift-line.com/downloads and their store/Bandcamp order links; no public changelog."

[[product]]
name = "Astronaut"
page = "https://www.kvraudio.com/product/astronaut-reverb-by-shift-line"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "oktabep"
page = "https://www.kvraudio.com/product/oktabep-by-shift-line"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
