changelog = "https://www.waproduction.com/plugins/view/instacomposer-3"

[[product]]
name = "Instascale"
page = "https://www.waproduction.com/plugins/view/instascale"
version_regex = '(?s).*version ([0-9]+(?:\.[0-9]+)+) - '
changelog = "https://www.waproduction.com/plugins/view/instascale"
