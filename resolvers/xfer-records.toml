# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). The earlier "kvraudio blocks bots" claim only holds for
# HTTP/2 clients: KVR serves HTTP/1.1 + browser UA requests (plugscan's ureq
# client qualifies; verified live 2026-08-31: Serum 2 at 2.1.5 exact,
# Cthulhu Mac 1.249 >= 1.248 installed).
# Cthulhu_MFX ships in the Cthulhu installer and shares its version.
# PinkTrombone / PinkTromboneFX (installed 1.0.5) have no KVR page and no
# other indexed version source was found - those two bundles stay unresolved.
# Single-product pages; id="verosx" is the Mac "Product Version" field.
# vendor-direct re-checked 2026-08-31: xferrecords.com product pages expose
# only stale demo-download paths (e.g. cthulhu-demo-1-1); full installers and
# release notes live behind account login, and Serum 2 is PACE-locked. KVR wins.
vendor = "Xfer Records"
homepage = "https://xferrecords.com"

[manual]
login = "https://xferrecords.com/customer_sessions/new"
steps = "Log in at xferrecords.com, open Account > Downloads: each product (Serum 2, Cthulhu, ...) lists the current installer version and release notes."

[[product]]
name = "Cthulhu"
page = "https://www.kvraudio.com/product/cthulhu-by-xfer-records"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Cthulhu_MFX"
page = "https://www.kvraudio.com/product/cthulhu-by-xfer-records"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Serum2"
page = "https://www.kvraudio.com/product/serum-2-by-xfer-records"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
