# Correction 2026-08-31 (wave-3 re-test): the skip was wrong. The Dehumaniser
# binary (strings on the .component) fetches its update check from a PUBLIC S3
# text file that states the current version in plain text:
#   https://s3-us-west-2.amazonaws.com/dehumaniser/DHII_Version_Number.txt -> "v1.4.3"
# (companion DHII_Version_Description.txt carries the changelog, and
# DH_II_OSX_LatestVersion_64.zip is the installer). No auth, plain GET.
# Verified live 2026-08-31: v1.4.3 == installed 1.4.3.
vendor = "Krotos"
homepage = "https://www.krotosaudio.com"

[[product]]
name = "Dehumaniser"
page = "https://s3-us-west-2.amazonaws.com/dehumaniser/DHII_Version_Number.txt"
strategy = "page_regex"
version_regex = 'v([0-9]+\.[0-9]+\.[0-9]+)'
download = "https://s3-us-west-2.amazonaws.com/dehumaniser/DH_II_OSX_LatestVersion_64.zip"
changelog = "https://s3-us-west-2.amazonaws.com/dehumaniser/DHII_Version_Description.txt"
