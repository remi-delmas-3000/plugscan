# Third-party source: KVR Audio product-database page (developer-maintained,
# may lag releases). mozaicbeats.com itself is unreachable from HTTP clients,
# but the KVR "Chord Prism by Mozaic Beats" page tracks Chord Prism 2 (Mac
# 2.1.11 >= 2.1.3 installed, verified live 2026-08-31). Both catalog entries
# (effect + instrument) ship in the same installer/version.
# KVR needs HTTP/1.1 + browser UA (plugscan's ureq client qualifies);
# id="verosx" is the Mac "Product Version" field.
# vendor-direct re-checked 2026-08-31: mozaicbeats.com is unreachable from HTTP
# clients (no response), so no vendor-direct source; KVR stays.
vendor = "MozaicBeats"
homepage = "https://mozaicbeats.com"

[manual]
steps = "Open mozaicbeats.com in a browser and check the Chord Prism 2 page / your account downloads for the latest installer; updates are also announced in the Mozaic Beats vendor forum on kvraudio.com."

[[product]]
name = "Chord Prism 2"
page = "https://www.kvraudio.com/product/chord-prism-by-mozaic-beats"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Chord Prism 2 (Instrument)"
page = "https://www.kvraudio.com/product/chord-prism-by-mozaic-beats"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
