# ADPTR AUDIO plugins (Hype, MetricAB, Sculpt, Streamliner, Utopia) are distributed by
# Plugin Alliance (installed under /Applications/Plugin Alliance/) and update via the
# PA Installation Manager; the PA site is JS-rendered with versions behind the login.
vendor = "ADPTR"
homepage = "https://www.plugin-alliance.com"
download_via = "Plugin Alliance Installation Manager - log in at plugin-alliance.com, then Manage My Account > Installation Manager (or the PA Installation Manager desktop app)"

[manual]
login = "https://www.plugin-alliance.com/en/login.html"
steps = "Log in at plugin-alliance.com; the Installation Manager or My Licenses page shows the latest version of each ADPTR plugin."
