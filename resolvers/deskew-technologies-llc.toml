# Third-party source: KVR Audio product-database page (developer-maintained,
# may lag releases). KVR tracks GP Relayer as its own product, independently
# of Gig Performer's versioning (verified live 2026-08-31: 1.0.22, exact
# match to installed). KVR needs HTTP/1.1 + browser UA (plugscan's ureq
# client qualifies); id="verosx" is the Mac "Product Version" field.
# vendor-direct re-checked 2026-08-31: gigperformer.com/release-notes tracks the
# Gig Performer app version (5.x/6.x), not GPRelayer's independent 1.0.x that
# KVR tracks. No vendor-direct source for the GPRelayer version, so KVR stays.
vendor = "Deskew Technologies, LLC"
homepage = "https://gigperformer.com"

[manual]
steps = "Download the latest Gig Performer installer from gigperformer.com/download (GPRelayer is bundled); update announcements at community.gigperformer.com."

[[product]]
name = "GPRelayer"
page = "https://www.kvraudio.com/product/gp-relayer-by-deskew-technologies"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
