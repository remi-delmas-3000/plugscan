# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). The earlier "KVR is Cloudflare-protected" claim only
# holds for HTTP/2 clients: KVR serves HTTP/1.1 + browser UA requests
# (plugscan's ureq client qualifies; verified live 2026-08-31, exact matches
# to installed: Fermenter 1.2.1, Nudistort 1.2.6).
# Single-product pages; id="verosx" is the Mac "Product Version" field.
# vendor-direct re-checked 2026-08-31: nudistaudio.com/download and
# /download/<product> gate the installer behind account login and carry no
# server-side version string (only a Facebook-pixel "version='2.0'"). KVR wins.
vendor = "Nudist Audio"
homepage = "https://www.nudistaudio.com"

[manual]
login = "https://www.nudistaudio.com/login"
steps = "Log in at nudistaudio.com/login and re-download installers from the downloads page (/download); update announcements are posted to nudistaudio.substack.com."

[[product]]
name = "Fermenter"
page = "https://www.kvraudio.com/product/fermenter-by-nudist-audio"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Nudistort"
page = "https://www.kvraudio.com/product/nudistort-by-nudist-audio"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
