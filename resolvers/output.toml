# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31). Single-product pages; id="verosx" is
# the Mac "Product Version" field.
# Verified 2026-08-31: Movement 1.3.0 and Portal 1.3.0 (>= 1.2.1 installed),
# Thermal Mac 1.2.1 (exact; the Windows field is already 1.3.0).
vendor = "Output"
homepage = "https://output.com"
download_via = "Output Hub — Output's desktop manager app (get it from output.com after logging in); it shows and installs the latest versions of Movement, Portal and Thermal"

[manual]
login = "https://output.com/login"
steps = "Log in at output.com or open Output Hub; it shows and installs the latest versions of Movement, Portal and Thermal."

[[product]]
name = "Movement"
page = "https://www.kvraudio.com/product/movement-by-output"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Portal"
page = "https://www.kvraudio.com/product/portal-by-output"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Thermal"
page = "https://www.kvraudio.com/product/thermal-by-output"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
