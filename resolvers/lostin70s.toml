# Correction 2026-08-31: both halves of the earlier skip are now wrong.
# The TLS chain verifies cleanly again (plain curl succeeds), and although the
# site is an Angular SPA, its backing API is public JSON:
#   https://www.lostin70s.com/api/products          (all products, "version" field)
#   https://www.lostin70s.com/api/products/<ID>     (single product)
# Verified live: BassDeluxe 1.3.0, DevilSpring 1.2.0, HaNonB70 1.5.3,
# KeysOfThe70s 2.2.2, ModernDeluxe 2.3.1 (all == installed).
# LivePedalboard1 and ToneDeluxeV2 are no longer in the vendor catalog
# (discontinued/replaced - not present in /api/products), so they have no
# resolver entries.
vendor = "Lostin70s"
homepage = "https://www.lostin70s.com"

[manual]
steps = "All plugins are free - re-download the latest installer from lostin70s.com (product pages show the current version)."

[[product]]
name = "BassDeluxe1"
page = "https://www.lostin70s.com/api/products/BassDeluxe"
strategy = "json"
json_path = "version"
download = "https://www.lostin70s.com/products/BassDeluxe"

