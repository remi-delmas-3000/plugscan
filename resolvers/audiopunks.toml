# Audiopunks publish all plugin installers on a single downloads page; versions
# appear in the installer file names (e.g. "Audiopunks - Buenos-v1.1.0.pkg").
# Only the latest installer is listed per product, so first match = latest.
vendor = "Audiopunks"
homepage = "https://audiopunks.com"

[manual]
steps = "Open https://audiopunks.com/downloads/ — every plugin is listed with its latest Mac (.pkg) and Windows (.zip) installer; the version is in the file name."

[[product]]
name = "AP Buenos"
page = "https://audiopunks.com/downloads/"
version_regex = 'Buenos-v?([0-9]+\.[0-9]+\.[0-9]+)'

