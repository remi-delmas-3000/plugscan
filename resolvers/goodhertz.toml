# All Goodhertz plugins ship in one bundle installer; goodhertz.com/downloads/ shows
# "Goodhertz X.Y.Z" with public installer links. Verified 2026-08-30 (3.14.1).
# Beta builds (names ending B1/B2) are excluded: they version
# independently of the main release and are not on the downloads page.
vendor = "Goodhertz"
homepage = "https://goodhertz.com"

[manual]
steps = "Installers are public at goodhertz.com/downloads/ (one bundle for all plugins). Licences activate in-plugin."

[[product]]
name = "Ghz CanOpener Studio 3"
page = "https://goodhertz.com/downloads/"
version_regex = 'Goodhertz ([0-9]+\.[0-9]+\.[0-9]+)'
