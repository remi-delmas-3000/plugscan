# manage.safaripedals.com/plugins/ is a public JSON feed with the latest
# version for every current plugin (endpoint found via the Safari Pedals
# Installer app; verified live 2026-08-31, e.g. Gorilla Drive 2.1.0).
# Entries use page_regex on the JSON body because the "plugins" array order is
# not stable enough for positional json_path. Cubby, Meaw Assist, Meaw Chain,
# Polyrex and Super-Chunk are not in the feed and stay manual-only.
vendor = "Safari Pedals"
homepage = "https://safaripedals.com"
download_via = "Safari Pedals Installer app (in /Applications; download from safaripedals.com account) installs and updates all plugins."

[manual]
login = "https://safaripedals.com/account"
steps = "Log in at safaripedals.com (Account) for installers; the plugins also self-update via the Safari Pedals Installer."

[[product]]
name = "Bull Sub Machine"
page = "https://manage.safaripedals.com/plugins/"
strategy = "page_regex"
version_regex = '"name":\s*"Bull Sub Machine",\s*"version":\s*"([0-9][0-9.]*)"'
download = "https://safaripedals.com"

