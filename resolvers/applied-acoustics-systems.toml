# Third-party source: KVR Audio product-database pages (developer-maintained,
# may lag releases). KVR needs HTTP/1.1 + browser UA (plugscan's ureq client
# qualifies; verified live 2026-08-31). Single-product pages; id="verosx" is
# the Mac "Product Version" field.
# Verified 2026-08-31: AAS Player 1.6.7 (exact), Chromaphone 3.2.0 (>= 3.1.5),
# Objeq Delay 2 2.0.0 (exact). The original Objeq Delay (installed 1.3.4) has
# no KVR page anymore - /product/objeq-delay-by-... 301s to the Objeq Delay 2
# page - so it has no entry (superseded product, version frozen).
vendor = "Applied Acoustics Systems"
homepage = "https://www.applied-acoustics.com"

[manual]
login = "https://www.applied-acoustics.com/login/"
steps = "Log in at applied-acoustics.com; the Downloads/My Products area lists the current installer version for Chromaphone, Objeq Delay and AAS Player. Plugins also have a built-in update check."

[[product]]
name = "AAS Player"
page = "https://www.kvraudio.com/product/aas-player-by-applied-acoustics-systems"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Chromaphone 3"
page = "https://www.kvraudio.com/product/chromaphone-by-applied-acoustics-systems"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "Objeq Delay 2"
page = "https://www.kvraudio.com/product/objeq-delay-2-by-applied-acoustics-systems"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
