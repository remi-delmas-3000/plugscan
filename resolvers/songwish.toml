# Third-party source: KVR Audio product-database page (developer-maintained,
# may lag releases; SongWish announces releases on KVR). The earlier "KVR is
# Cloudflare-protected" claim only holds for HTTP/2 clients: KVR serves
# HTTP/1.1 + browser UA requests (plugscan's ureq client qualifies; verified
# live 2026-08-31: reMIDI 4 at 4.5.0 >= 4.4.2 installed).
# reMIDI 4 and reMIDI 4 MFX ship from the same installer and share a version.
# id="verosx" is the Mac "Product Version" field.
vendor = "SongWish"
homepage = "https://songwish.ca"

[manual]
steps = "Open songwish.ca in a browser; the store/download area serves the latest reMIDI 4 installer (covers reMIDI 4 and reMIDI 4 MFX). Release announcements appear on the KVR SongWish developer page."

[[product]]
name = "reMIDI 4"
page = "https://www.kvraudio.com/product/remidi-4-by-songwish"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"

[[product]]
name = "reMIDI 4 MFX"
page = "https://www.kvraudio.com/product/remidi-4-by-songwish"
version_regex = 'id="verosx">\s*([0-9][0-9A-Za-z.]*)'
via = "KVR Audio"
