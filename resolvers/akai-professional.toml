# MPC release notes: akaipro.com/page-data/mpc-release-notes/page-data.json
# (Gatsby page-data, plain JSON, newest release first). Verified live
# 2026-08-31: first "MPC 3.x" match is 3.9.1 with installed 3.9.1.2, first
# "MPC 2.x" match is 2.15 with installed 2.15.1.1. The JSON truncates the
# 4-part installer versions, but the truncation is a strict prefix of the
# installed version and never overstates, which prefix-compare handles
# correctly, so the source is acceptable. The smaller plugins (Flex Beat,
# Ring The Alarm, Studio Instrument Collection) still have no public version
# source (re-verified 2026-08-31: their update check talks to the
# authenticated api.inmusicbrands.com; authorizations.akaipro.com/Plugins/ is
# 403) - they stay manual via the inMusic portal.
vendor = "Akai Professional"
homepage = "https://www.akaipro.com"

[manual]
login = "https://profile.inmusicbrands.com"
steps = "Log in to your inMusic Profile (profile.inmusicbrands.com) and download MPC / MPC 3 and plugin installers from your registered products. Release notes: https://www.akaipro.com/mpc-release-notes/ (browser only; content is JS-rendered)."

[[product]]
name = "MPC"
page = "https://www.akaipro.com/page-data/mpc-release-notes/page-data.json"
strategy = "page_regex"
version_regex = 'MPC (2\.[0-9][0-9.]*)'
changelog = "https://www.akaipro.com/mpc-release-notes/"

[[product]]
name = "MPC 3"
page = "https://www.akaipro.com/page-data/mpc-release-notes/page-data.json"
strategy = "page_regex"
version_regex = 'MPC (3\.[0-9][0-9.]*)'
changelog = "https://www.akaipro.com/mpc-release-notes/"
