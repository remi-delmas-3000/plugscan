# denise.io 301-redirects to deniseaudio.com (a Webflow site). Verified 2026-08-30:
# the public /downloads page and /plugins/<slug> pages carry NO per-plugin version
# string; download buttons point at unversioned S3 zips
# (e.g. deniseaudio.s3.amazonaws.com/Bad+Tape+Denise+Audio+Mac.zip — no version in
# the filename or a header). Updates and version info live in the my.babyaud.io
# account portal. Nothing web-scrapeable maps to the installed version -> skip.
vendor = "Denise Audio"
homepage = "https://www.deniseaudio.com"
skip = "Webflow site with no public per-plugin version; downloads are unversioned S3 zips and versions live only in the my.babyaud.io account portal; re-verified 2026-08-31: the /downloads and /legacy-downloads pages serve only unversioned S3 zips and the Webflow product pages carry no version"
[manual]
login = "https://my.babyaud.io/auth/login"
steps = "Log in at my.babyaud.io (the Baby Audio / denise account portal) to see current versions and download installers. Public deniseaudio.com pages link only to unversioned S3 zips."
