[package]
name = "plugscan"
version = "0.2.0"
edition = "2021"
description = "Fast audio plugin inventory and update awareness for macOS (AU/VST/VST3/CLAP)"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }
plist = "1"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[profile.release]
lto = true
