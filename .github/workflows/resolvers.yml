name: resolver-exercise

# Nightly: run every resolver against the live web so extraction rot surfaces
# within a day. A failing extraction (site redesign, dead page, moved version
# string) fails the job and opens/updates a tracking issue. This is the cheap
# substitute for MacUpdater's 24/7 verification servers.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  exercise:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Exercise all resolvers
        id: exercise
        run: |
          ./target/release/plugscan --resolvers ./resolvers resolver test --json > result.json || true
          python3 - <<'PY'
          import json
          rows = json.load(open("result.json"))
          fails = [r for r in rows if not r["ok"]]
          print(f"{len(rows)-len(fails)}/{len(rows)} resolver entries OK, {len(fails)} failed")
          if fails:
              lines = "\n".join(f"- **{r['vendor']} {r['bundle']}**: {r['error']}" for r in fails[:100])
              open("report.md","w").write(f"## Resolver rot report\n\n{len(fails)} entries failed:\n\n{lines}\n")
          import sys; sys.exit(1 if fails else 0)
          PY
      - name: Open or update rot-tracking issue
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Resolver rot detected"
          content-filepath: report.md
          labels: resolver-rot
